name: Tests and screenshots (local Supabase + Android emulator)

# Runs the real app on an Android emulator against a LOCAL Supabase stack
# loaded with fictional demo data (supabase/seed.sql). Never touches the live
# school project. Results are pushed to the "evidence" branch.

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ["lib/**", "integration_test/**", "test/**", "supabase/**", "ci/**", ".github/workflows/e2e-evidence.yml"]

permissions:
  contents: write

jobs:
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Start local Supabase with demo data
        run: |
          mkdir -p evidence/logs
          yes n | supabase init --force || true
          printf '\n[functions.manage-users]\nverify_jwt = false\n' >> supabase/config.toml
          supabase start -x studio,imgproxy,vector,logflare 2>&1 | sed -E 's/(sb_secret_|sb_publishable_|eyJ)[A-Za-z0-9._-]+/\1***REDACTED***/g; s/(Secret|secret|S3 Access Key|S3 Secret Key|JWT secret)( *: *| *= *)[^ ]+/\1\2***REDACTED***/g' | tee evidence/logs/supabase_start.log
          supabase status -o env | sed 's/"//g' > /tmp/sb.env
          sed -E 's/(KEY|SECRET|PASSWORD)=.*/\1=***/' /tmp/sb.env > evidence/logs/supabase_status.txt
          set -a; . /tmp/sb.env; set +a
          echo "API_URL=$API_URL" >> "$GITHUB_ENV"
          echo "DB_URL=$DB_URL" >> "$GITHUB_ENV"
          echo "ANON_KEY=${ANON_KEY:-$PUBLISHABLE_KEY}" >> "$GITHUB_ENV"
          nohup supabase functions serve --no-verify-jwt > evidence/logs/functions_serve.log 2>&1 &
          sleep 20
          psql "$DB_URL" -c "select role, full_name, admission_no, class_name from public.profiles order by role, full_name;" | tee evidence/logs/demo_accounts.txt
          psql "$DB_URL" -c "select count(*) as careers from public.careers;" | tee -a evidence/logs/demo_accounts.txt

      - name: Edge Function check (manage-users rejects callers who are not logged in)
        run: |
          curl -s -o evidence/logs/edge_anon.json -w "HTTP %{http_code}\n" -X POST "$API_URL/functions/v1/manage-users" \
            -H "apikey: $ANON_KEY" -H "Content-Type: application/json" -d '{"action":"create_student"}' \
            | tee evidence/logs/edge_anon_status.txt
          cat evidence/logs/edge_anon.json; echo

      - name: Generate Android project
        run: flutter create . --org ng.sch.gssus --project-name gss_counselling --platforms android

      - name: Static analysis and unit tests
        run: |
          flutter pub get
          flutter analyze --no-fatal-infos --no-fatal-warnings 2>&1 | tee evidence/logs/flutter_analyze.log
          flutter test --reporter expanded 2>&1 | tee evidence/logs/unit_tests.log

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Run end-to-end test on emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          script: bash ci/run_e2e.sh

      - name: Database security tests (row-level security, run after e2e on a fresh reset)
        if: always()
        run: |
          set +e
          supabase db reset > evidence/logs/db_reset_1.log 2>&1
          psql "$DB_URL" -v ON_ERROR_STOP=0 -f testing_evidence/rls_core_test.sql > evidence/logs/rls_core_test.out 2>&1
          supabase db reset > evidence/logs/db_reset_2.log 2>&1
          psql "$DB_URL" -v ON_ERROR_STOP=0 -f testing_evidence/rls_careers_test.sql > evidence/logs/rls_careers_test.out 2>&1
          for f in evidence/logs/rls_*.out; do tail -n 5 "$f"; done

      - name: Device and timing information
        if: always()
        run: |
          {
            echo "Run date (UTC): $(date -u)"
            echo "Runner: GitHub Actions ubuntu-latest"
            echo "Emulator: Android API 34, google_apis x86_64, Pixel 6 profile"
            flutter --version
            supabase --version
          } > evidence/logs/environment.txt 2>&1
          cp build/integration_response_data.json evidence/logs/ 2>/dev/null || true
          grep 'STEP|' evidence/logs/e2e_test.log > evidence/logs/e2e_steps.txt 2>/dev/null || true

      - name: Publish evidence to the "evidence" branch
        if: always()
        run: |
          cp -r evidence /tmp/evidence
          git config user.name "ci-bot" && git config user.email "ci-bot@users.noreply.github.com"
          git checkout --orphan evidence-tmp
          git rm -rf --cached . > /dev/null
          find . -mindepth 1 -maxdepth 1 ! -name .git -exec rm -rf {} +
          cp -r /tmp/evidence/* .
          grep -rlE 'sb_secret_[A-Za-z0-9]{6}|service_role' . --include='*.log' --include='*.txt' --include='*.json' | xargs -r sed -i -E 's/sb_secret_[A-Za-z0-9._-]+/sb_secret_***REDACTED***/g'
          echo "Evidence from commit ${GITHUB_SHA::7}, run ${GITHUB_RUN_ID}" > README.md
          git add -A && git commit -qm "Evidence from ${GITHUB_SHA::7}"
          git push -f origin evidence-tmp:evidence
