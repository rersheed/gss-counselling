name: Build APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Generate Android project
        run: flutter create . --org ng.sch.gssus --project-name gss_counselling --platforms android

      - name: Build
        run: |
          set -o pipefail
          {
            flutter --version
            flutter pub get
            flutter analyze --no-fatal-infos --no-fatal-warnings
            flutter test
            flutter build apk --release
          } 2>&1 | tee build.log

      - name: Publish APK to the "apk" branch
        if: success()
        run: |
          mkdir -p /tmp/out && cp build/app/outputs/flutter-apk/app-release.apk /tmp/out/gss-counselling.apk
          cp build.log /tmp/out/build.log
          git config user.name "ci-bot" && git config user.email "ci-bot@users.noreply.github.com"
          git checkout --orphan apk && git rm -rf --cached . >/dev/null && git clean -fdx -e /tmp/out >/dev/null || true
          cp /tmp/out/* . && git add gss-counselling.apk build.log
          git commit -m "APK from ${GITHUB_SHA::7}" && git push -f origin apk

      - name: Publish build log on failure
        if: failure()
        run: |
          cp build.log /tmp/build.log 2>/dev/null || echo "no log" > /tmp/build.log
          git config user.name "ci-bot" && git config user.email "ci-bot@users.noreply.github.com"
          git checkout --orphan ci-log && git rm -rf --cached . >/dev/null; git clean -fdx >/dev/null || true
          cp /tmp/build.log build.log && git add build.log
          git commit -m "Failed build ${GITHUB_SHA::7}" && git push -f origin ci-log

      - uses: actions/upload-artifact@v4
        if: success()
        with:
          name: gss-counselling-apk
          path: build/app/outputs/flutter-apk/app-release.apk
